{{- if .Values.enableAlertmanagerConfig }}
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertcatcher
  namespace: {{ .Values.namespace }}
  labels:
    app: alertcatcher
spec:
  route:
    receiver: webhook
    repeatInterval: 1m
  receivers:
  - name: webhook
    webhookConfigs:
    - url: 'http://alertcatcher.monitoring:8080/api/v1/webhook'
{{- end }}
